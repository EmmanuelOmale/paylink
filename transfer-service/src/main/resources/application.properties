spring.datasource.url=jdbc:h2:file:./data/paylink;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.sql.init.mode=always
spring.h2.console.enabled=true
paylink.rate-limit.max-per-window=5
paylink.rate-limit.window-seconds=60
paylink.idempotency.ttl-hours=24
paylink.risk.max-attempts=3
paylink.risk.base-backoff-ms=100
paylink.risk.max-backoff-ms=1000
